<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healthy Me Onboarding</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Cpath fill=%27%232B1D17%27 d=%27M12 21s-8-5-8-11.2A4.6 4.6 0 0 1 12 6.6a4.6 4.6 0 0 1 8 3.2C20 16 12 21 12 21z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF7F0; --card:#F3ECE3; --card-2:#FFFDF9; --line:#E8DFD4;
  --ink:#2B1D17; --muted:#8C8078; --faint:#B8ADA3;
  --dark:#2B1D17; --disabled:#B3A9A0;
  --green:#6E8F2E; --green-bg:#EEF1DE; --warn:#E39B32; --warn-bg:#FBEBD2;
  --page:#E9E2D8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--page);color:var(--ink);min-height:100vh;display:flex;justify-content:center;align-items:center;gap:40px;padding:32px 16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* phone */
.phone{width:390px;height:800px;background:var(--bg);border-radius:48px;border:10px solid #1b1310;position:relative;overflow:hidden;box-shadow:0 30px 60px rgba(43,29,23,.25);flex-shrink:0}
.status{height:54px;position:relative;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 44px;z-index:3}
.status .time{font-family:-apple-system,"SF Pro Text",Inter,sans-serif;font-size:17px;font-weight:600;letter-spacing:-.4px;width:54px;text-align:center}
.status .icons{display:flex;align-items:center;gap:6px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;background:#000;border-radius:20px}
.screen{position:absolute;top:54px;left:0;right:0;bottom:0;display:flex;flex-direction:column;animation:in .28s ease}
#app.static *{animation:none!important}
@keyframes in{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top .back{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:20px}
.top .title{font-size:15px;font-weight:500}
.progress{display:flex;gap:4px;padding:0 20px 8px}
.progress i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.progress i.on{background:var(--dark)}
.body{flex:1;overflow-y:auto;padding:12px 20px 16px}
.body::-webkit-scrollbar{display:none}
h1{font-size:28px;line-height:1.2;font-weight:600;text-align:center;letter-spacing:-.3px}
.sub{font-size:14px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.45}
.footer{padding:12px 20px 28px}
.cta{width:100%;height:52px;border-radius:26px;background:var(--dark);color:#fff;font-size:14px;font-weight:600;transition:.2s}
.cta:disabled{background:var(--disabled);cursor:default}
.ghost{width:100%;height:52px;border-radius:26px;background:rgba(118,118,128,.12);color:var(--ink);font-size:14px;font-weight:600;margin-top:10px}
.link{display:block;text-align:center;margin-top:14px;font-size:14px;color:var(--muted);text-decoration:underline}

.opts{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);text-align:left;transition:.15s}
.opt .ic{width:36px;height:36px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.opt .t{font-size:15px;font-weight:500}
.opt .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.opt .chk{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.opt.radio.sel{border-color:var(--ink)}
.opt.sel .chk{background:var(--dark);border-color:var(--dark)}
.opt.off{opacity:.45;cursor:not-allowed}
.opt .tag{font-size:11px;color:var(--warn);margin-top:3px;font-weight:500}

.label{font-size:12px;font-weight:600;color:var(--muted);margin:22px 0 10px}
.seg{display:flex;gap:8px}
.seg button{flex:1;height:48px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-size:15px;font-weight:500}
.seg button.sel{background:var(--dark);color:#fff;border-color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sub-block p{text-align:center}
.legal{font-size:12px;line-height:1.4;color:var(--muted);text-align:center;margin-top:12px;text-wrap:pretty}
.legal a{color:var(--ink)}
.chip{padding:10px 14px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);font-size:14px;font-weight:500}
.chip.sel{background:var(--dark);color:#fff;border-color:var(--dark)}
.chip.off{opacity:.4;cursor:not-allowed}
.sub-block{margin-top:10px;padding:12px;border-radius:14px;background:var(--card);animation:in .25s ease}
.sub-block p{font-size:13px;color:var(--muted);margin-bottom:8px}

.num{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:6px 8px 6px 16px}
.num .v{font-size:26px;font-weight:600}
.num .v small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.num .st{display:flex;gap:6px}
.num .st button{width:40px;height:40px;border-radius:50%;background:var(--card);font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .num{padding:6px 6px 6px 12px}
.row2 .num .v{font-size:22px}
.row2 .num .st{gap:4px}
.row2 .num .st button{width:32px;height:32px;font-size:18px}

.note{border-radius:14px;padding:14px;margin-top:18px;font-size:13px;line-height:1.45;animation:in .25s ease}
.note b{display:block;font-size:14px;margin-bottom:4px}
.note.ok{background:var(--green-bg)}
.note.ok b{color:var(--green)}
.note.warn{background:var(--warn-bg)}
.note.warn b{color:#B06F10}
.note .fix{margin-top:10px;background:#fff;border-radius:16px;padding:8px 14px;font-size:13px;font-weight:600}

.consent{margin-top:18px;padding:14px;border-radius:14px;background:var(--card);animation:in .25s ease}
.consent .h{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.consent p{font-size:12.5px;color:var(--muted);line-height:1.45;margin:6px 0 10px}
.consent label{display:flex;gap:10px;align-items:flex-start;font-size:13px;cursor:pointer;line-height:1.4}
.consent input{width:18px;height:18px;accent-color:var(--dark);margin-top:1px;flex-shrink:0}
.consent a{color:var(--ink)}

.textin{width:100%;border:none;border-bottom:1px solid var(--line);background:none;font-family:inherit;font-size:28px;text-align:center;padding:14px 0;margin-top:40px;outline:none;color:var(--ink)}

/* welcome */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;text-align:center}
.logo{font-size:40px;font-weight:600;letter-spacing:-1px}
.logo-sub{font-size:15px;color:var(--muted);margin-top:4px}
.bubbles{display:grid;grid-template-columns:repeat(3,72px);gap:12px;margin:40px 0}
.bubbles div{height:72px;border-radius:20px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:30px}
.bubbles div:nth-child(2),.bubbles div:nth-child(5){position:relative;top:18px}
.time-pill{display:inline-flex;gap:6px;align-items:center;background:var(--card);padding:6px 12px;border-radius:14px;font-size:12.5px;color:var(--muted);margin-top:18px}

/* loading */
.ring{width:170px;height:170px;border-radius:50%;margin:30px auto 24px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:600;position:relative}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.steps{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.steps div{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--faint);transition:.3s}
.steps div.done{color:var(--ink)}
.steps span{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:.3s}
.steps div.done span{background:var(--green);border-color:var(--green)}

/* plan */
.plan-card{background:var(--card-2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.plan-card .k{font-size:12px;color:var(--muted);font-weight:600}
.plan-card .big{font-size:20px;font-weight:600;margin-top:6px}
.plan-card ul{list-style:none;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.plan-card li{font-size:13.5px;line-height:1.4;display:flex;gap:8px}
.plan-card li:before{content:"✓";color:var(--green);font-weight:700}
.day1{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.day1:first-of-type{border-top:none}
.day1 .img{width:52px;height:52px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px}
.day1 .t{font-size:15px;font-weight:500}
.day1 .d{font-size:12.5px;color:var(--muted)}

/* notif */
.bell{width:96px;height:96px;border-radius:50%;background:var(--warn-bg);display:flex;align-items:center;justify-content:center;font-size:42px;margin:30px auto 20px}
.times{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:22px}
.times button{height:52px;border-radius:14px;background:var(--card-2);border:1px solid var(--line);font-size:15px;font-weight:500}
.times button small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.times button.sel{background:var(--dark);color:#fff;border-color:var(--dark)}
.times button.sel small{color:#cfc5bc}
.sys{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:5;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sys-box{width:270px;background:rgba(245,242,238,.97);border-radius:14px;text-align:center;overflow:hidden}
.sys-box h4{font-size:16px;font-weight:600;padding:18px 16px 4px}
.sys-box p{font-size:13px;padding:0 16px 16px;color:#333}
.sys-box div{display:flex;border-top:1px solid #ccc}
.sys-box div button{flex:1;padding:12px;font-size:16px;color:#0A7AFF}
.sys-box div button+button{border-left:1px solid #ccc;font-weight:600}

/* save */
.auth{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.auth button{height:52px;border-radius:26px;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.auth .apple{background:#000;color:#fff}
.auth .mail{background:var(--card-2);border:1px solid var(--line)}

/* home */
.home-h{display:flex;justify-content:space-between;align-items:center;padding:6px 20px 0}
.home-h h2{font-size:28px;font-weight:600}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.daybar{margin:14px 20px 0;padding:14px;border-radius:16px;background:var(--dark);color:#fff}
.daybar .k{font-size:12px;opacity:.7}
.daybar .big{font-size:18px;font-weight:600;margin-top:4px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.2);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:#B9D46A;transition:.4s}
.task{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.task .cb{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:.2s}
.task.done .cb{background:var(--green);border-color:var(--green)}
.task .img{width:54px;height:54px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:24px}
.task .t{font-size:15px;font-weight:500}
.task .d{font-size:12.5px;color:var(--muted)}
.later{font-size:12px;color:var(--muted);font-weight:600;margin:20px 0 4px}
.task.locked{opacity:.5;cursor:default}
.tabbar{position:absolute;bottom:16px;left:16px;right:16px;height:60px;border-radius:30px;background:rgba(255,253,249,.95);box-shadow:0 4px 20px rgba(0,0,0,.08);display:flex;justify-content:space-around;align-items:center;font-size:10.5px;color:var(--muted)}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar div:first-child{color:var(--ink);font-weight:600}
.tabbar span{font-size:17px}
.toast{position:absolute;left:20px;right:20px;bottom:90px;background:var(--green);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;animation:in .3s;z-index:4}

/* side panel */
.panel{width:360px;flex-shrink:0}
.panel .eyebrow{font-size:12px;color:var(--muted);font-weight:600}
.panel h3{font-size:22px;font-weight:600;margin:6px 0 16px;line-height:1.25}
.counter{display:flex;gap:10px;margin-bottom:20px}
.counter div{flex:1;background:var(--bg);border-radius:14px;padding:12px}
.counter b{font-size:24px;display:block}
.counter small{font-size:12px;color:var(--muted)}
.counter .new b{color:var(--green)}
.cmp{background:var(--bg);border-radius:16px;padding:16px;margin-bottom:12px}
.cmp .k{font-size:13px;font-weight:700;margin-bottom:6px}
.cmp.before .k{color:#B5563B}
.cmp.after .k{color:var(--green)}
.cmp p{font-size:14px;line-height:1.5}
.panel .ctrls{display:flex;gap:8px;margin-top:18px}
.panel .ctrls button{padding:10px 14px;border-radius:20px;background:var(--bg);font-size:13px;font-weight:500}
.panel .ctrls{align-items:center}
.lang{display:flex;background:var(--bg);border-radius:20px;padding:3px}
.lang-top{display:inline-flex;margin-bottom:20px}
.panel .lang button{padding:7px 12px;border-radius:16px;background:none;font-size:12.5px;font-weight:600;color:var(--muted)}
.panel .lang button.on{background:var(--dark);color:#fff}

@media (max-width:860px){
  body{padding:0;display:block;background:var(--bg)}
  .panel{display:none}
  .phone{width:100%;height:100vh;height:100dvh;border:none;border-radius:0;box-shadow:none}
}
.i{width:1em;height:1em;display:block;flex-shrink:0}
.bubbles div{color:var(--ink);font-size:28px}
.opt .ic{color:var(--ink);font-size:20px}
.img{color:var(--ink)}
.day1 .img,.task .img{font-size:24px}
.bell{color:#B06F10;font-size:40px}
.time-pill .i{font-size:14px}
.consent .h .i{font-size:16px}
.auth .i{font-size:20px}
.tabbar span{font-size:20px}

/* iOS segmented control */
.ios-seg{position:relative;display:flex;height:36px;padding:2px;border-radius:10px;background:rgba(118,118,128,.12)}
.ios-seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:8px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transition:transform .25s cubic-bezier(.3,.7,.4,1)}
.ios-seg[data-on="1"] i{transform:translateX(100%)}
.ios-seg button{flex:1;position:relative;z-index:1;font-size:14px;font-weight:500;color:var(--ink)}
.ios-seg button.on{font-weight:600}
/* inset grouped list */
.group{margin-top:20px;background:var(--card-2);border-radius:12px;overflow:hidden}
.row{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:16px;text-align:left;position:relative}
.row+.row:before,.wheel+.row:before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:rgba(60,60,67,.18)}
.row .val{color:var(--muted);font-variant-numeric:tabular-nums;font-size:16px}
.row.open .val{color:var(--ink)}
/* wheel picker */
.wheel{position:relative;height:180px;overflow:hidden}
.wheel .band{position:absolute;left:8px;right:8px;top:72px;height:36px;border-radius:8px;background:rgba(118,118,128,.12);pointer-events:none}
.wheel .wunit{position:absolute;top:72px;height:36px;line-height:36px;left:calc(50% + 34px);font-size:18px;color:var(--ink);pointer-events:none;z-index:2}
.ws{height:180px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.ws::-webkit-scrollbar{display:none}
.wpad{height:72px}
.wi{height:36px;line-height:36px;text-align:center;font-size:21px;color:var(--faint);scroll-snap-align:center;cursor:pointer;font-variant-numeric:tabular-nums}
.wi.sel{color:var(--ink)}

.note{background:none!important;border-radius:0;padding:8px 16px 0;margin-top:0;font-size:13px;line-height:1.4;color:var(--muted);animation:none}
.note b{display:inline;font-size:13px;font-weight:400;color:var(--muted)!important;margin:0}
.note b:after{content:". "}
.note .fix{display:block;width:calc(100% + 32px);margin:14px -16px 0;height:44px;padding:0 16px;text-align:left;background:var(--card-2);border-radius:12px;font-size:16px;font-weight:400;color:var(--ink)}

.bmi-val{display:flex;align-items:center;gap:8px}
.bmi-ic{font-size:20px;display:flex}
.bmi-ic.ok{color:#5E8C2A}.bmi-ic.warn{color:#D9892B}
/* iOS sheet */
.sheet-wrap{position:absolute;inset:0;z-index:6}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,0);transition:.3s}
.sheet-wrap.on .sheet-bg{background:rgba(0,0,0,.3)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-bottom:30px}
.sheet-wrap.on .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:6px auto 0}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px}
.sheet-h b{font-size:17px;font-weight:600}
.sheet-h b{text-align:center}
.sh-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(118,118,128,.14);color:var(--ink)}
.sh-btn .i{stroke-width:2.2}
.sh-btn.ok{justify-self:end;background:var(--dark);color:#fff}
.sheet-body{padding:8px 20px 0}
.bmi-big{font-size:48px;font-weight:600;text-align:center;letter-spacing:-1px;margin-top:6px}
.bmi-cat{text-align:center;font-size:15px;color:var(--muted);margin-top:2px}
.scale{position:relative;display:flex;gap:2px;height:8px;margin-top:22px}
.scale i{border-radius:4px}
.scale .mark{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--bg)}
.scale-l{position:relative;height:16px;margin-top:6px;font-size:11px;color:var(--muted)}
.scale-l span{position:absolute;transform:translateX(-50%)}
.scale-l span:nth-child(1){left:0;transform:none}.scale-l span:nth-child(2){left:17.5%}.scale-l span:nth-child(3){left:50%}.scale-l span:nth-child(4){left:75%}.scale-l span:nth-child(5){right:0;transform:none}
.srow{cursor:default}
.srow span:first-child{display:flex;align-items:center;gap:10px}
.srow .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.srow.cur span{font-weight:600;color:var(--ink)}
.sheet-foot{font-size:13px;color:var(--muted);line-height:1.4;padding:8px 16px 0}
.nw{white-space:nowrap}
.sub{text-wrap:balance}
.opt .ic-g{background:none;font-size:30px}
.opt .trail{margin-left:auto;padding-left:12px;font-size:15px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

.crow .rl{display:flex;flex-direction:column;gap:2px}
.crow .rl small{font-size:13px;color:var(--muted)}
.crow.dis{opacity:.35;cursor:default}
.cbx{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--faint);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:#fff;transition:.15s}
.cbx.on{background:var(--dark);border-color:var(--dark)}
.cbx .i{stroke-width:2.6}

const fastingBlocked = ()=> isPreg() || S.health.includes('Type 1 diabetes');
const needsTarget = ()=> S.goal==='Lose weight' && !isPreg();

/* ---------- flow (adaptive) ---------- */
function flow(){
  const f=['welcome','goal','body'];
  if(needsTarget()) f.push('target');
  f.push('health','include','time','name','loading','plan','notif','save','home');
  return f;
}
let curKey='welcome';
const cur=()=>curKey;
let DIR=1;
function go(d){ DIR=d<0?-1:1; document.querySelector('.sheet-wrap')?.remove(); const f=flow(); const i=Math.max(0,Math.min(f.length-1,f.indexOf(curKey)+d)); curKey=f[i]; render(); }
function restart(){ Object.assign(S,{goal:null,health:[],wheel:null,limb:null,consent:false,include:['Workouts','Meal plan'],minutes:10,name:'',notif:null,tasks:{},done:{},detail:null,day:0,minPicked:false,pregOverride:false,sex:'Female',age:35,height:164,weight:66,target:61,open:null}); curKey='welcome'; render(); }

/* ---------- helpers ---------- */
const topBar=(title='',showBack=true)=>`
  <div class="top"><button class="back" onclick="go(-1)" style="visibility:${showBack?'visible':'hidden'}">←</button><div class="title">${L(title)}</div><div style="width:32px"></div></div>`;
function prog(){
  const quiz=flow().filter(s=>!['welcome','loading','plan','notif','save','home'].includes(s));
  const i=quiz.indexOf(cur());
  return `<div class="progress">${quiz.map((_,k)=>`<i class="${k<=i?'on':''}"></i>`).join('')}</div>`;
}
const opt=(icon,t,d,sel,on,extra='',radio=false)=>`<button class="opt ${sel?'sel':''} ${radio?'radio':''} ${extra}" onclick="${on}"><div class="ic">${icon}</div><div><div class="t">${t}</div>${d?`<div class="d">${d}</div>`:''}</div>${radio?'':`<div class="chk">${sel?'✓':''}</div>`}</button>`;
function pick(k,v){S[k]=v;render();setTimeout(()=>go(1),480);}
const footer=(label,enabled=true,action='go(1)',extra='')=>`<div class="footer"><button class="cta" ${enabled?'':'disabled'} onclick="${action}">${L(label)}</button>${extra}</div>`;
const AVG={Female:{age:35,height:164,weight:66},Male:{age:35,height:178,weight:82}};
function setSex(x){ if(S.sex===x)return; S.sex=x; Object.assign(S,AVG[x]); S.target=S.weight-5; render(); }
const segCtl=()=>`<div class="ios-seg" data-on="${S.sex==='Male'?1:0}"><i></i>${['Female','Male'].map(x=>`<button class="${S.sex===x?'on':''}" onclick="setSex('${x}')">${L(x)}</button>`).join('')}</div>`;
const RANGE={age:[16,90,'years'],height:[130,210,'cm'],weight:[35,200,'kg'],target:[35,200,'kg']};
function wheel(key){
  const [min,max,unit]=RANGE[key];let items='';
  for(let v=min;v<=max;v++)items+=`<div class="wi ${v===S[key]?'sel':''}" onclick="this.parentNode.scrollTo({top:${(v-min)*36},behavior:'smooth'})">${v}</div>`;
  return `<div class="wheel"><div class="band"></div><div class="wunit">${L(unit)}</div><div class="ws" data-key="${key}" onscroll="onWheel(this)"><div class="wpad"></div>${items}<div class="wpad"></div></div></div>`;
}
const row=(key,label)=>`<button class="row ${S.open===key?'open':''}" onclick="S.open=S.open==='${key}'?null:'${key}';render()"><span>${L(label)}</span><span class="val" data-val="${key}">${S[key]} ${L(RANGE[key][2])}</span></button>${S.open===key?wheel(key):''}`;
function onWheel(el){
  const k=el.dataset.key,[min,max]=RANGE[k];
  const v=Math.max(min,Math.min(max,min+Math.round(el.scrollTop/36)));
  el.querySelectorAll('.wi').forEach((w,i)=>w.classList.toggle('sel',i===v-min));
  if(v===S[k])return;
  S[k]=v;
  const lab=document.querySelector(`[data-val="${k}"]`);if(lab)lab.textContent=`${v} ${L(RANGE[k][2])}`;
  refreshLive();
}
function initWheels(){document.querySelectorAll('.ws').forEach(el=>{el.scrollTop=(S[el.dataset.key]-RANGE[el.dataset.key][0])*36;});}
function refreshLive(){
  document.getElementById('app').classList.add('static');
  const tmp=document.createElement('div');tmp.innerHTML=V[cur()]();
  document.querySelectorAll('#app [data-live]').forEach(el=>{const n=tmp.querySelector(`[data-live="${el.dataset.live}"]`);if(n)el.replaceWith(n);});
}
function set(k,v){S[k]=v;render();}

plan:()=>{
  const adj=[];
  if(isPreg()) adj.push(L(S.pregOverride&&S.goal==='Lose weight'?'Gentle workouts and a mild calorie deficit for pregnancy & postpartum':'Gentle workouts and nourishing meals for pregnancy & postpartum'));

  if(S.health.includes('Limb loss')) adj.push(L('Exercises adapted for limb loss · {l}',{l:lower(L(S.limb))}));
  if(S.health.some(h=>h.startsWith('Sensitive'))) adj.push(L('Low-impact moves · {x}',{x:lower(S.health.filter(h=>h.startsWith('Sensitive')).map(h=>L(h)).join(', '))}));
  if(S.health.some(h=>h.includes('diabetes'))) adj.push(L('Meals balanced for stable blood sugar'));
  const goalLine = S.goal==='Lose weight'&&!isPreg()?L('{a} → {b} kg in ~{w} weeks',{a:S.weight,b:S.target,w:Math.ceil((S.weight-S.target)/0.5)})
    : L(S.goal==='Build muscle'?'Strength focus · protein-forward meals'
    : S.goal==='Keep fit'?'Stay active · balanced meals':'Gentle movement · mindset first');
  const wk = S.health.includes('Wheelchair')?'Seated upper body':S.health.includes('Limb loss')?'Adaptive strength':isPreg()?'Gentle prenatal flow':S.goal==='Build muscle'?'Strength starter':'Full body starter';
  S._wk=wk;
  const gIcon={'Lose weight':'flame','Build muscle':'dumbbell','Keep fit':'sparkle','Find self-love':'heart'};
  const adapted=isPreg()&&S.goal==='Lose weight'&&!S.pregOverride;
  const gTitle=titleCase(adapted?L('Stay active & healthy'):L(S.goal));
  const gSub=adapted?L('Adapted for pregnancy: gentle pace and no calorie deficit.'):isPreg()&&S.goal==='Lose weight'?L('Gentle pace · mild calorie deficit'):goalLine;
  // short "adapted" chips
  const chips=[];

  // weekly focus split
  const base={'Lose weight':[35,20,15,30],'Build muscle':[50,20,15,15],'Keep fit':[35,30,15,20],'Find self-love':[20,30,35,15]}[S.goal]||[30,30,20,20];
  let f=[...base]; if(isPreg()){f[0]-=15;f[1]+=15;} if(!S.include.includes('Meal plan')){f[3]=0;}
  const names=['Strength','Mobility','Mindset','Nutrition'], cols=['#2B1D17','#8DB255','#E3A857','#C9B3A0'];
  const sum=f.reduce((a,b)=>a+b,0); f=f.map(v=>Math.round(v/sum*100));
  const C=2*Math.PI*42; let acc=0;
  const donut=`<svg viewBox="0 0 100 100" class="donut">${f.map((v,k)=>{if(!v)return'';const len=v/100*C,gap=f.filter(Boolean).length>1?2:0;const el=`<circle cx="50" cy="50" r="42" fill="none" stroke="${cols[k]}" stroke-width="12" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=len;return el;}).join('')}<text x="50" y="47" text-anchor="middle" class="dn-v">${S.minutes}</text><text x="50" y="61" text-anchor="middle" class="dn-l">${L('min/day')}</text></svg>`;
  const legend=f.map((v,k)=>v?`<li><i style="background:${cols[k]}"></i><span>${L(names[k])}</span><b>${v}%</b></li>`:'').join('');
  // first week preview

  const week=[0,1,2,3,4].map(n=>{const ts=dayTasks(n),w=ts[0],d=addDays(today,n);
    const lab=n===0?L('Today'):new Intl.DateTimeFormat(loc,{weekday:'short',day:'numeric'}).format(d);
    return `<div class="wcard"><div class="wc-top" style="background:${tints[n%5]}">${ic('image')}</div><div class="wc-b"><b>${w.title}</b><small>${ts.reduce((a,t)=>a+t.min,0)} ${L('min')}</small></div></div>`;}).join('');
  const init=(S.name||'N').trim()[0].toUpperCase();
  return `<div class="screen">${topBar('',false)}<div class="body" style="padding-top:0">
  <div class="prof">
    <div class="av-lg"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="37" fill="none" stroke="var(--line)" stroke-width="3"/><circle cx="40" cy="40" r="37" fill="none" stroke="var(--green)" stroke-width="3" stroke-linecap="round" stroke-dasharray="${2*Math.PI*37*0.14} 999" transform="rotate(-90 40 40)"/></svg><span>${init}</span></div>
    <h1>${L('{n}, your plan is ready',{n:S.name})}</h1>
    <div class="goal-pill">${ic(adapted?'heart':gIcon[S.goal]||'sparkle')}<span>${gTitle}</span></div>
    <div class="goal-sub">${gSub}</div>
    ${adapted?`<button class="ghost sm" onclick="openOverride()">${L('Keep weight loss goal')}</button>`:''}
  </div>
  <div class="stat3">
    <div><small>${L('Age')}</small><b>${S.age}</b></div>
    <div><small>${L('Height')}</small><b>${S.height}<em>${L('cm')}</em></b></div>
    <div><small>${L('Weight')}</small><b>${S.goal==='Lose weight'&&!isPreg()?`${S.weight}→${S.target}`:S.weight}<em>${L('kg')}</em></b></div>
  </div>
  <div class="sec-h"><span>${titleCase(L('Weekly focus'))}</span></div>
  <div class="group focus">${donut}<ul class="legend">${legend}</ul></div>
  <div class="sec-h"><span>${titleCase(L('Your first week'))}</span><span>${L('{m} min a day',{m:S.minutes+3})}</span></div>
  <div class="hscroll">${week}</div>

  </div>${footer('Start day 1',true,'btnLoad(this,()=>go(1))')}</div>`;

home:()=>{

    <div class="group">${S._skel?tasks.map(()=>`<div class="lrow"><span class="tile sk"></span><span class="tt"><span class="sk sk-l"></span><span class="sk sk-s"></span></span></div>`).join(''):tasks.map(row).join('')}</div>

function detailView(t,day){
  const isToday=day===0, left=t.items.filter(i=>!S.done[i.id]).length, all=left===0;
  const sub=t.kind==='wk'?L('{m} min · {k} exercises',{m:t.min,k:t.items.length}):t.min?L('{m} min · {k} steps',{m:t.min,k:t.items.length}):'';
  const card=it=>`<div class="opt ex ${isToday?'':'off-t'}" ${isToday?`onclick="S.done['${it.id}']=!S.done['${it.id}'];render()"`:''}><div class="ic">${ic(it.icon)}</div><div><div class="t">${it.t}</div>${it.min?`<div class="d">${it.min} ${L('min')}</div>`:''}</div>${isToday?`<span class="cbx ${S.done[it.id]?'on':''}">${S.done[it.id]?ic('check'):''}</span>`:''}</div>`;
  const cta=!isToday?`<button class="cta" disabled>${L('Opens on day {n}',{n:day+1})}</button>`
    :all?`<button class="cta" onclick="closeDetail()">${L('Done')}</button>`
    :`<button class="cta" onclick="startNext(this)">${L(t.kind==='wk'?'Start Workout':t.kind==='mind'?'Start Reading':'Start')}</button>`;
  return `<div class="screen"><div class="top"><button class="back" onclick="closeDetail()">←</button><div class="title"></div><div style="width:32px"></div></div>
  <div class="body" style="padding-top:8px">
    <h1>${t.title}</h1>${sub?`<div class="sub">${sub}</div>`:''}
    <div class="opts">${t.items.map(card).join('')}</div>
  </div><div class="footer">${cta}</div></div>`;
}
/* ---------- actions ---------- */
const startOfDay=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
function split(names,total){const k=names.length,base=Math.max(1,Math.floor(total/k));return names.map((n,i)=>[n,i===k-1?Math.max(1,total-base*(k-1)):base]);}
function dayTasks(n){
  const wkAlt=['Mobility & stretch','Core & balance'];
  const wk=n%2===0?(S._wk||'Full body starter'):wkAlt[Math.floor(n/2)%2];
  const EX={
    'Full body starter':['Warm-up','Squats','Glute bridge','Push-ups on knees','Cool-down stretch'],
    'Strength starter':['Warm-up','Squats','Glute bridge','Push-ups on knees','Cool-down stretch'],
    'Seated upper body':['Seated warm-up','Arm circles','Band rows','Chest press','Seated stretch'],
    'Adaptive strength':['Warm-up','Core bracing','Single-arm band row','Balance drill','Cool-down stretch'],
    'Gentle prenatal flow':['Breathing','Cat-cow','Side-lying leg lifts','Pelvic tilts','Relax'],
    'Mobility & stretch':['Neck & shoulder rolls','Cat-cow','Hip opener','Hamstring stretch'],
    'Core & balance':['Dead bug','Bird dog','Side plank','Balance hold']
  };
  const exList=S.health.includes('Wheelchair')?EX['Seated upper body']:isPreg()?EX['Gentle prenatal flow']:EX[wk];
  const t=[{id:'wk'+n,key:isPreg()?'Gentle prenatal flow':wk,icon:'dumbbell',kind:'wk',title:titleCase(L(wk)),min:S.minutes,items:split(exList,S.minutes).map(([x,m])=>({t:titleCase(L(x)),min:m,icon:'dumbbell'}))}];
  const feats=S.include.filter(x=>x!=='Workouts'&&x!=='Mindset');
  const meta={'Meal plan':['bowl','Today’s recipes',5,['Breakfast','Lunch','Dinner']],'Cycle tracking':['cycle','Log how you feel',2,['Log how you feel']],'Fasting':['timer','Your 12:12 window',1,['Start 12:12 fast']]};
  feats.forEach((f,k)=>{ if(n>=k+1){const [icon,sub,min,its]=meta[f];t.push({id:f+n,icon,kind:'feat',title:titleCase(L(f)),sub:L(sub),min,isNew:n===k+1,items:its.map(x=>({t:titleCase(L(x)),icon}))});} });
  const mind=n===0?[['We Know What You’re Thinking',2],['Stop Them Before They Stop You',1]]:[[L('Chapter {c}: part {p}',{c:n+1,p:1}),2],[L('Chapter {c}: part {p}',{c:n+1,p:2}),1]];
  t.push({id:'mind'+n,icon:'bulb',kind:'mind',title:titleCase(n===0?L('Start with your mind'):L('Mindset · chapter {c}',{c:n+1})),min:3,items:mind.map(([x,m])=>({t:titleCase(L(x)),min:m,icon:'bulb'}))});
  t.forEach(x=>x.items.forEach((it,i)=>it.id=x.id+':'+i));
  return t;
}
const taskDone=t=>t.items.every(it=>S.done[it.id]);
function openDetail(id){DIR=1;S.detail=id;render();}
function closeDetail(){DIR=-1;S.detail=null;render();}
function startNext(el){const t=dayTasks(S.day||0).find(x=>x.id===S.detail);const it=t.items.find(i=>!S.done[i.id]);if(!it)return closeDetail();btnLoad(el,()=>{S.done[it.id]=true;render();});}
function setDay(n){ if(n===(S.day||0))return; DIR=n>(S.day||0)?1:-1; S.day=n; S._skel=true; render(); document.querySelector('.swipe')?.classList.add(DIR<0?'slide-l':'slide-r'); clearTimeout(S._skT); S._skT=setTimeout(()=>{S._skel=false;render();document.querySelector('.swipe')?.classList.add('reveal');},380); }
function btnLoad(el,fn,ms=650){ if(el.classList.contains('loading'))return; el.classList.add('loading'); setTimeout(fn,ms); }
function bindSwipe(){
  const el=document.querySelector('.swipe');if(!el)return;
  let x0=null;
  el.addEventListener('pointerdown',e=>{x0=e.clientX;});
  el.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;
    if(Math.abs(dx)>50){const nd=Math.max(0,Math.min(27,(S.day||0)+(dx<0?1:-1)));if(nd!==(S.day||0)){setDay(nd);}}});
}
function toggleHealth(h){
  if(h==='None'){S.health=S.health.includes('None')?[]:['None'];S.consent=false;S.wheel=null;S.limb=null;}
  else{
    S.health=S.health.filter(x=>x!=='None');
    S.health=S.health.includes(h)?S.health.filter(x=>x!==h):[...S.health,h];
    if(h==='Wheelchair'&&!S.health.includes(h))S.wheel=null;
    if(h==='Limb loss'&&!S.health.includes(h))S.limb=null;
  }
  if(fastingBlocked())S.include=S.include.filter(x=>x!=='Fasting');
  if(isPreg())S.include=S.include.filter(x=>x!=='Cycle tracking');
  render();
}
function toggleInc(t){S.include=S.include.includes(t)?S.include.filter(x=>x!==t):[...S.include,t];render();}
function runLoading(){
  let p=0,step=0;const dots=[...document.querySelectorAll('.step-dots i')],line=document.getElementById('stepLine');
  const iv=setInterval(()=>{
    p+=4;const el=document.getElementById('pct'),arc=document.getElementById('arc');
    if(!el){clearInterval(iv);return;}
    el.textContent=Math.min(p,100)+'%';arc.style.strokeDashoffset=490-490*Math.min(p,100)/100;
    const ns=Math.min(S._steps.length-1,Math.floor(p/25));
    if(ns!==step&&line){step=ns;line.innerHTML=`<span>${S._steps[step]}</span>`;}
    dots.forEach((d,i)=>{d.classList.toggle('done',i<ns||p>=100);d.classList.toggle('cur',i===ns&&p<100);});
    if(p>=100){clearInterval(iv);setTimeout(()=>go(1),450);}
  },70);
}
function bmiCat(b){return b<18.5?'Underweight':b<25?'Normal':b<30?'Overweight':'Obesity';}
const FOLLOW={
  'Diabetes':{q:'Which type of diabetes?',opts:['Type 1 diabetes','Type 2 diabetes'],codes:true},
  'Pregnancy':{q:'What applies to you?',opts:['Prenatal','Postnatal'],codes:true},
  'Wheelchair':{key:'wheel',q:'Which classes interest you?',opts:['Wheelchair fitness','Wheelchair cardio']},
  'Limb loss':{key:'limb',q:'Which type of limb loss?',opts:['Upper limb','Lower limb']}
};
function followState(id){
  const f=FOLLOW[id];if(!f)return null;
  if(f.codes){const sel=f.opts.find(o=>S.health.includes(o));return {on:!!sel,sub:sel?L(sel):''};}
  return {on:S.health.includes(id),sub:S[f.key]?L(S[f.key]):''};
}
function clearFollow(id){
  const f=FOLLOW[id];
  if(f.codes){S.health=S.health.filter(x=>!f.opts.includes(x));render();}
  else toggleHealth(id);
}
function openSheet(title,body,ok=true){
  const d=document.createElement('div');d.className='sheet-wrap';
  d.innerHTML=`<div class="sheet-bg" onclick="closeSheet()"></div><div class="sheet"><div class="grabber"></div>
    <div class="sheet-h"><button class="sh-btn" aria-label="Close" onclick="closeSheet()">${ic('x')}</button><b>${title}</b>${ok?`<button class="sh-btn ok" aria-label="Done" onclick="closeSheet()">${ic('check')}</button>`:'<span></span>'}</div>
    <div class="sheet-body">${body}</div></div>`;
  document.getElementById('phone').appendChild(d);
  requestAnimationFrame(()=>d.classList.add('on'));
}
const SMALL=new Set(['a','an','the','and','but','or','for','nor','of','to','in','on','at','by','as','у','в','з','і','й','та','а','о','до','на','за','під','про','для','від','або','із','зі','що']);
const titleCase=t=>t.split(/([\s ]+)/).map((w,i)=>/^[\s ]+$/.test(w)||!w?w:(i>0&&SMALL.has(w.toLowerCase()))?w:w[0].toUpperCase()+w.slice(1)).join('');
function openFollow(h){
  const f=FOLLOW[h];
  openSheet(titleCase(L(h)),`<p class="sheet-q">${L(f.q)}</p><div class="group">${f.opts.map(o=>`<button class="row" onclick="chooseFollow('${h}','${o}')"><span>${L(o)}</span></button>`).join('')}</div>`,false);
}
function chooseFollow(id,o){
  const f=FOLLOW[id];
  if(f.codes){S.health=S.health.filter(x=>!f.opts.includes(x));toggleHealth(o);}
  else{S[f.key]=o;if(!S.health.includes(id))toggleHealth(id);else render();}
  closeSheet();
}
function openOverride(){
  openSheet(titleCase(L('Weight loss goal')),`<p class="sheet-text">${L('During pregnancy and after birth, your body needs extra energy. That’s why we suggest a plan without calorie restriction.')}</p>
  <p class="sheet-text">${L('If you still want to lose weight, we’ll keep the pace gentle and the deficit mild. We recommend discussing it with your doctor.')}</p>
  <button class="cta" style="margin-top:22px" onclick="S.pregOverride=true;closeSheet();render()">${L('Keep weight loss goal')}</button>
  <button class="ghost" onclick="closeSheet()">${L('Keep adapted plan')}</button>`,false);
}
function openBmiSheet(){
  const b=+bmi(S.weight,S.height).toFixed(1), cat=bmiCat(b);
  const lo=15,hi=35,pos=Math.max(0,Math.min(100,(b-lo)/(hi-lo)*100));
  const seg=[['Underweight',15,18.5,'#8FB3D9'],['Normal',18.5,25,'#8DB255'],['Overweight',25,30,'#E3A857'],['Obesity',30,35,'#D9785B']];
  const d=document.createElement('div');d.className='sheet-wrap';
  d.innerHTML=`<div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet"><div class="grabber"></div>
    <div class="sheet-h"><button class="sh-btn" aria-label="Close" onclick="closeSheet()">${ic('x')}</button><b>${L('Body Mass Index')}</b><button class="sh-btn ok" aria-label="Done" onclick="closeSheet()">${ic('check')}</button></div>
    <div class="sheet-body">
      <div class="bmi-big">${b}</div>
      <div class="bmi-cat">${L(cat)}</div>
      <div class="scale">${seg.map(([n,a,z,c])=>`<i style="flex:${z-a};background:${c}"></i>`).join('')}<span class="mark" style="left:${pos}%"></span></div>
      <div class="scale-l"><span>15</span><span>18.5</span><span>25</span><span>30</span><span>35</span></div>
      <div class="group" style="margin-top:22px">${seg.map(([n,a,z,c])=>`<div class="row srow ${n===cat?'cur':''}"><span><i class="dot" style="background:${c}"></i>${L(n)}</span><span class="val">${n==='Underweight'?'< 18.5':n==='Obesity'?'≥ 30':a+' – '+(z-0.1).toFixed(1)}</span></div>`).join('')}</div>
      <p class="sheet-foot">${L('BMI is weight in kilograms divided by height in meters squared.')} ${L('It doesn’t account for muscle mass, age or body shape, so we use it only as a starting point for your plan.')}</p>
    </div></div>`;
  document.getElementById('phone').appendChild(d);
  requestAnimationFrame(()=>d.classList.add('on'));
}
function closeSheet(){const d=document.querySelector('.sheet-wrap');if(!d)return;d.classList.remove('on');setTimeout(()=>d.remove(),300);}
function showSys(){
  const d=document.createElement('div');d.className='sys';
  d.innerHTML=`<div class="sys-box"><h4>${L('“Healthy Me” Would Like to Send You Notifications')}</h4><p>${L('Daily reminder at {t}',{t:S.notif})}</p><div><button onclick="this.closest('.sys').remove();go(1)">${L('Don’t Allow')}</button><button onclick="this.closest('.sys').remove();go(1)">${L('Allow')}</button></div></div>`;
  document.getElementById('phone').appendChild(d);
}

/* ---------- render ---------- */
function render(){
  const k=cur();
  // loading screen restarts its timer on render; don't re-render it mid-animation for a language switch
  const app=document.getElementById('app');
  const vk=k+(k==='home'&&S.detail?'/'+S.detail:'');
  const same=app.dataset.k===vk;
  const y=same?(app.querySelector('.body')?.scrollTop||0):0;
  if(!(k==='loading'&&document.getElementById('pct'))){
    const before=same?[...app.querySelectorAll('.cbx,.opt .chk,.wd')].map(e=>e.classList.contains('on')||e.classList.contains('sel')||e.textContent.trim()==='✓'):[];
    app.classList.toggle('static',same);
    app.innerHTML=V[k]();
    if(!same)app.firstElementChild?.classList.add(DIR<0?'from-left':'from-right');
    if(same)[...app.querySelectorAll('.cbx,.opt .chk,.wd')].forEach((e,i)=>{const on=e.classList.contains('on')||e.classList.contains('sel')||e.textContent.trim()==='✓';if(on&&before[i]===false)e.classList.add('pop');});
    app.dataset.k=vk;
    initWheels();
    bindSwipe();
    if(same&&app.querySelector('.body'))app.querySelector('.body').scrollTop=y;
  }
  document.getElementById('ptabs').innerHTML=[['design','What changed'],['impact','Product impact']].map(([k,t])=>`<button class="${PANEL===k?'on':''}" onclick="PANEL='${k}';render()">${titleCase(L(t))}</button>`).join('');
  document.getElementById('paneDesign').classList.toggle('off',PANEL!=='design');
  document.getElementById('paneImpact').classList.toggle('off',PANEL!=='impact');
  document.getElementById('impact').innerHTML=IMPACT.map(([t,d,m],i)=>`<li><span class="num-b">${i+1}</span><div><b>${L(t)}</b><p>${L(d)}</p><span class="metric">${ic('bars')}${L(m)}</span></div></li>`).join('');
  document.getElementById('changes').innerHTML=CHANGES.map(([t,d],i)=>`<li><span class="num-b">${i+1}</span><div><b>${L(t)}</b><p>${L(d)}</p></div></li>`).join('');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=L(el.dataset.i));
  document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.dataset.l===LANG));
  if(k==='name')setTimeout(()=>document.getElementById('nm')?.focus(),50);
}
document.documentElement.lang=LANG==='ua'?'uk':'en';
render();
</script>
